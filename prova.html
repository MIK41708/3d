<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Química - ENEM & Vestibulares</title>
    <link rel="stylesheet" href="acessibilidade.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 800px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            margin-top: 0;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent-color);
        }

        .meta-info {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .topic-badge {
            background-color: #e0e6ed;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            display: inline-block;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.05em;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* ESTILO PARA A IMAGEM DA QUESTÃO */
        .question-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0 20px 0;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 14px 18px;
            text-align: left;
            font-size: 0.98em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            line-height: 1.4;
        }

        .option-btn:hover {
            background-color: #f1f2f6;
            border-color: #a4b0be;
        }

        .option-btn.selected-correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
            font-weight: 600;
        }

        .option-btn.selected-wrong {
            background-color: #f8d7da !important;
            border-color: var(--wrong-color) !important;
            color: #721c24;
        }

        .option-btn.reveal-correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            display: none;
            padding: 10px;
            border-radius: 4px;
        }

        .feedback.correct {
            display: block;
            color: var(--correct-color);
        }

        .feedback.wrong {
            display: block;
            color: var(--wrong-color);
        }

        #result-card {
            background-color: var(--primary-color);
            color: white;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
        }

        #result-card h2 {
            margin-top: 0;
        }

        .score-text {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .action-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>

        const userAnswers = {};

        function loadQuiz() {
            const quizBox = document.getElementById('quiz-box');
            quizBox.innerHTML = '';

            questionsData.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${qIndex}`;

                let imageHTML = '';
                if (q.image) {
                    imageHTML = `<img src="${q.image}" class="question-image" alt="Imagem da questão">`;
                }

                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <button class="option-btn" id="btn-${qIndex}-${oIndex}" onclick="selectOption(${qIndex}, ${oIndex})">
                            ${escapeHTML(opt)}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="meta-info">${q.meta}</div>
                    <div class="topic-badge">${q.topic}</div>
                    <div class="question-text">${escapeHTML(q.text)}</div>
                    ${imageHTML} 
                    <div class="options-container">
                        ${optionsHTML}
                    </div>
                    <div class="feedback" id="feedback-${qIndex}"></div>
                `;

                quizBox.appendChild(card);
            });
        }

        function escapeHTML(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function selectOption(qIndex, oIndex) {
            const totalOptions = questionsData[qIndex].options.length;
            for (let i = 0; i < totalOptions; i++) {
                const btn = document.getElementById(`btn-${qIndex}-${i}`);
                btn.style.borderColor = '#dcdde1';
                btn.style.backgroundColor = '#f8f9fa';
                btn.style.fontWeight = 'normal';
                btn.style.color = '#333';
            }

            const selectedBtn = document.getElementById(`btn-${qIndex}-${oIndex}`);
            selectedBtn.style.borderColor = 'var(--accent-color)';
            selectedBtn.style.backgroundColor = '#e3f2fd';
            selectedBtn.style.fontWeight = '600';

            userAnswers[qIndex] = oIndex;
        }

        function finishQuiz() {
            let score = 0;
            const total = questionsData.length;

            questionsData.forEach((q, qIndex) => {
                const userAns = userAnswers[qIndex];
                const correctAns = q.answer;
                const feedbackDiv = document.getElementById(`feedback-${qIndex}`);

                q.options.forEach((_, oIndex) => {
                    document.getElementById(`btn-${qIndex}-${oIndex}`).disabled = true;
                });

                if (userAns === undefined) {
                    feedbackDiv.className = "feedback wrong";
                    feedbackDiv.innerText = "Questão não respondida! A alternativa correta era a " + String.fromCharCode(65 + correctAns);
                    document.getElementById(`btn-${qIndex}-${correctAns}`).classList.add('reveal-correct');
                } else if (userAns === correctAns) {
                    score++;
                    feedbackDiv.className = "feedback correct";
                    feedbackDiv.innerText = "Parabéns! Resposta correta.";
                    document.getElementById(`btn-${qIndex}-${userAns}`).classList.add('selected-correct');
                } else {
                    feedbackDiv.className = "feedback wrong";
                    feedbackDiv.innerText = "Resposta incorreta! A alternativa certa era a " + String.fromCharCode(65 + correctAns);
                    document.getElementById(`btn-${qIndex}-${userAns}`).classList.add('selected-wrong');
                    document.getElementById(`btn-${qIndex}-${correctAns}`).classList.add('reveal-correct');
                }
            });

            document.getElementById('submit-all-btn').style.display = 'none';
            const resultCard = document.getElementById('result-card');
            resultCard.style.display = 'block';

            document.getElementById('score-display').innerText = `Acertaste ${score} de ${total} questões!`;

            const pct = (score / total) * 100;
            let msg = "";
            if (pct === 100) msg = "Incrível! Dominas totalmente a Química! 🎉";
            else if (pct >= 70) msg = "Muito bem! Tens uma excelente base e estás no caminho certo. 🚀";
            else if (pct >= 40) msg = "Bom esforço! Vale a pena rever os tópicos errados para consolidar a matéria. 📚";
            else msg = "Continua a estudar! A química requer prática, revise os conceitos básicos e tente outra vez. 💪";
            
            document.getElementById('performance-feedback').innerText = msg;
            resultCard.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = loadQuiz;
    </script>
