<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessibilidade - Ajuste de Fonte</title>
  <style>
    /* Configuração base da página */
    html {
      font-size: 100%;
      transition: font-size 0.2s ease;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 20px;
      line-height: 1.5;
    }

    /* Painel de acessibilidade */
    .painel-acessibilidade {
      background-color: #f0f0f0;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .painel-acessibilidade button {
      padding: 8px 12px;
      font-size: 1rem;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
    }

    .painel-acessibilidade button:hover {
      background-color: #e0e0e0;
    }

    /* Usar 'rem' nos elementos para que o texto reaja à mudança */
    h1 {
      font-size: 2rem;
    }

    p {
      font-size: 1rem;
    }

    span {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- Controles de Acessibilidade -->
  <div class="painel-acessibilidade">
    <span>Tamanho do texto:</span>
    <button onclick="alterarFonte(-10)" aria-label="Diminuir texto">A-</button>
    <button onclick="redefinirFonte()" aria-label="Redefinir texto para 100%">100%</button>
    <button onclick="alterarFonte(10)" aria-label="Aumentar texto">A+</button>
    <span id="porcentagem-atual">100%</span>
  </div>

  <!-- Conteúdo de Exemplo -->
  <main>
    <h1>Exemplo de Acessibilidade</h1>
    <p>Este texto pode ser ampliado até 200% do seu tamanho original usando os botões acima.</p>
    <p>Todos os elementos com tamanhos em unidades relativas (rem) serão ajustados proporcionalmente, facilitando a leitura para pessoas com deficiência visual.</p>
  </main>

  <script>
    let tamanhoAtual = 100;
    const TAMANHO_MINIMO = 100;
    const TAMANHO_MAXIMO = 200;
    const elementoPorcentagem = document.getElementById('porcentagem-atual');

    function alterarFonte(delta) {
      let novoTamanho = tamanhoAtual + delta;

      // Garante que o tamanho permaneça entre 100% e 200%
      if (novoTamanho >= TAMANHO_MINIMO && novoTamanho <= TAMANHO_MAXIMO) {
        tamanhoAtual = novoTamanho;
        document.documentElement.style.fontSize = `${tamanhoAtual}%`;
        elementoPorcentagem.textContent = `${tamanhoAtual}%`;
      }
    }

    function redefinirFonte() {
      tamanhoAtual = 100;
      document.documentElement.style.fontSize = '100%';
      elementoPorcentagem.textContent = '100%';
    }
  </script>

</body>
</html>
